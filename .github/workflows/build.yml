name: Review build (no deployment)
on:
  pull_request:
  push:
    branches: [design/cinematic-homepage]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-review-build
          path: dist/
          retention-days: 14
